<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SET LIST TOOL</title>

  <link
    rel="stylesheet"
    href="./style.css?v=2"
  />

  <script
    src="./script.js?v=7"
    defer
  ></script>
</head>

<body>
  <main class="app">
    <header class="appHeader">

<div class="pageLinks settingsTabs">

  <button
    id="copyNowPlayingUrlButton"
    class="secondaryButton"
    type="button"
  >
    NOWPLAYING URL
  </button>

  <button
    id="copySetlistUrlButton"
    class="secondaryButton"
    type="button"
  >
    SET LIST URL
  </button>

<a
  id="playerPageLink"
  class="obsPageLink primaryButton"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
  >
    OPEN PLAYER
  </a>

</div>

    </header>

    <section
      class="controlPanel controlPanelSingle"
      aria-labelledby="controlPanelTitle"
    >
    <!-- プレビュー -->

<div class="settingsTabs">

  <button
    id="setlistTabButton"
    class="settingsTab isActive"
    type="button"
  >
    SET LIST
  </button>

  <button
    id="nowPlayingTabButton"
    class="settingsTab"
    type="button"
  >
  NOW PLAYING
  </button>

  <button
  id="editorTabButton"
  class="settingsTab"
  type="button"
>
  EDITOR
</button>

</div>

<div
  id="nowPlayingTab"
  class="settingsTabPanel"
  hidden
>

      <!-- Now Playing フォント -->


      
      <section
        class="controlGroup"
        aria-labelledby="nowPlayingFontTitle"
      >
        <div class="fontControls">
          <label
            class="fieldLabel"
            for="nowPlayingFontPreset"
          >
            よく使うフォント
          </label>

          <select
            id="nowPlayingFontPreset"
            class="selectInput"
          >
            <option value="">
              選択してください
            </option>

            <option value="Yu Gothic">
              游ゴシック
            </option>

            <option value="Yu Mincho">
              游明朝
            </option>

            <option value="Meiryo">
              メイリオ
            </option>

            <option value="MS Gothic">
              MS ゴシック
            </option>

            <option value="MS Mincho">
              MS 明朝
            </option>

            <option value="BIZ UDPGothic">
              BIZ UDPゴシック
            </option>

            <option value="BIZ UDPMincho">
              BIZ UDP明朝
            </option>

            <option value="Noto Sans JP">
              Noto Sans JP
            </option>

            <option value="Noto Serif JP">
              Noto Serif JP
            </option>
          </select>

          <label
            class="fieldLabel"
            for="nowPlayingFontInput"
          >
            PC内のフォント名を直接入力
          </label>

          <div class="fontInputRow">
            <input
              id="nowPlayingFontInput"
              class="textInput"
              type="text"
              placeholder="例：BIZ UDPゴシック"
              autocomplete="off"
              maxlength="100"
            />

            <button
              id="applyNowPlayingFontButton"
              class="secondaryButton"
              type="button"
            >
              適用
            </button>
          </div>
        </div>

        <div class="textDecorationGroup">
  <div class="controlGroupHeader">
    <h4>
      テキスト装飾
    </h4>
  </div>

<div class="decorationCard">
  <label
    class="fieldLabel"
    for="nowPlayingTextColor"
  >
    文字色
  </label>

  <div class="colorInputRow">
    <input
      id="nowPlayingTextColor"
      type="color"
      value="#ffffff"
      aria-label="Now Playingの文字色"
    />

    <span id="nowPlayingTextColorValue">
      #FFFFFF
    </span>
  </div>
</div>

<!-- 縁取りカード -->
<div class="decorationOption decorationCard">
  <div class="strokeHeader">
    <label class="toggleLabel">
      <input
        id="nowPlayingStrokeEnabled"
        type="checkbox"
        checked
      />

      <span>縁取り</span>
    </label>

    <div class="colorInputRow">
      <input
        id="nowPlayingStrokeColor"
        type="color"
        value="#000000"
        aria-label="Now Playingの縁取り色"
      />

      <span id="nowPlayingStrokeColorValue">
        #000000
      </span>
    </div>
  </div>

  <label
    class="fieldLabel"
    for="nowPlayingStrokeWidth"
  >
    太さ
  </label>

  <div class="rangeInputRow">
    <input
      id="nowPlayingStrokeWidth"
      type="range"
      min="0"
      max="4"
      step="0.25"
      value="2"
    />

    <span id="nowPlayingStrokeWidthValue">
      2px
    </span>
  </div>
</div>

<!-- シャドウカード -->
<div class="decorationOption decorationCard">
  <div class="shadowHeader">
    <label class="toggleLabel">
      <input
        id="nowPlayingShadowEnabled"
        type="checkbox"
      />

      <span>グロー</span>
    </label>

    <div class="colorInputRow">
      <input
        id="nowPlayingShadowColor"
        type="color"
        value="#000000"
        aria-label="Now Playingのシャドウ色"
      />

      <span id="nowPlayingShadowColorValue">
        #000000
      </span>
    </div>
  </div>

  <label
    class="fieldLabel"
    for="nowPlayingShadowBlur"
  >
    ぼかし
  </label>

  <div class="rangeInputRow">
    <input
      id="nowPlayingShadowBlur"
      type="range"
      min="0"
      max="6"
      step="0.25"
      value="6"
    />

    <span id="nowPlayingShadowBlurValue">
      6px
    </span>
  </div>
</div>

</div>

<div
  id="nowPlayingMarkerImageControls"
  class="markerImageControls"
>
  <input
    id="nowPlayingMarkerImageInput"
    class="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp,image/gif"
    hidden
  />

  <button
    type="button"
    id="nowPlayingMarkerImageButton"
    class="secondaryButton markerImageButton"
  >
    🖼 Now Playingアイコンを選択
  </button>

  <p
    id="nowPlayingMarkerImageName"
    class="fieldHint"
  >
    未選択（PNG・JPEG・WebP・GIF対応）
  </p>
  
<button
  type="button"
  id="clearNowPlayingMarkerImageButton"
  class="secondaryButton"
>
  🗑 アイコンを削除
</button>
  
</div>

      </section>

      </div>

      <div
  id="setlistTab"
  class="settingsTabPanel"
>

      <!-- セットリスト フォント -->
<section
  class="controlGroup noBorder"
  aria-labelledby="setlistFontTitle"
>
        <div class="fontControls">
          <label
            class="fieldLabel"
            for="setlistFontPreset"
          >
            よく使うフォント
          </label>

          <select
            id="setlistFontPreset"
            class="selectInput"
          >
            <option value="">
              選択してください
            </option>

            <option value="Yu Gothic">
              游ゴシック
            </option>

            <option value="Yu Mincho">
              游明朝
            </option>

            <option value="Meiryo">
              メイリオ
            </option>

            <option value="MS Gothic">
              MS ゴシック
            </option>

            <option value="MS Mincho">
              MS 明朝
            </option>

            <option value="BIZ UDPGothic">
              BIZ UDPゴシック
            </option>

            <option value="BIZ UDPMincho">
              BIZ UDP明朝
            </option>

            <option value="Noto Sans JP">
              Noto Sans JP
            </option>

            <option value="Noto Serif JP">
              Noto Serif JP
            </option>
          </select>

          <label
            class="fieldLabel"
            for="setlistFontInput"
          >
            PC内のフォント名を直接入力
          </label>

          <div class="fontInputRow">
            <input
              id="setlistFontInput"
              class="textInput"
              type="text"
              placeholder="例：BIZ UDPゴシック"
              autocomplete="off"
              maxlength="100"
            />

            <button
              id="applySetlistFontButton"
              class="secondaryButton"
              type="button"
            >
              適用
            </button>
          </div>
        </div>

        <p class="helpText">
          Windowsのフォント設定などに表示されている名前を入力してください。
        </p>
      </section>

<!-- 文字色カード -->
<div class="decorationCard">
  <label
    class="fieldLabel"
    for="setlistTextColor"
  >
    文字色
  </label>

  <div class="colorInputRow">
    <input
      id="setlistTextColor"
      type="color"
      value="#ffffff"
      aria-label="セットリストの文字色"
    />

    <span id="setlistTextColorValue">
      #FFFFFF
    </span>
  </div>
</div>

<!-- 縁取りカード -->
<div class="decorationOption decorationCard">
  <div class="strokeHeader">
    <label class="toggleLabel">
      <input
        id="setlistStrokeEnabled"
        type="checkbox"
        checked
      />

      <span>縁取り</span>
    </label>

    <div class="colorInputRow">
      <input
        id="setlistStrokeColor"
        type="color"
        value="#000000"
        aria-label="セットリストの縁取り色"
      />

      <span id="setlistStrokeColorValue">
        #000000
      </span>
    </div>
  </div>

  <label
    class="fieldLabel"
    for="setlistStrokeWidth"
  >
    太さ
  </label>

  <div class="rangeInputRow">
    <input
      id="setlistStrokeWidth"
      type="range"
      min="0"
      max="4"
      step="0.25"
      value="2"
    />

    <span id="setlistStrokeWidthValue">
      2px
    </span>
  </div>
</div>

<!-- シャドウカード -->
<div class="decorationOption decorationCard">
  <div class="shadowHeader">
    <label class="toggleLabel">
      <input
        id="setlistShadowEnabled"
        type="checkbox"
      />

      <span>グロー</span>
    </label>

    <div class="colorInputRow">
      <input
        id="setlistShadowColor"
        type="color"
        value="#000000"
        aria-label="セットリストのシャドウ色"
      />

      <span id="setlistShadowColorValue">
        #000000
      </span>
    </div>
  </div>

  <label
    class="fieldLabel"
    for="setlistShadowBlur"
  >
    ぼかし
  </label>

  <div class="rangeInputRow">
    <input
      id="setlistShadowBlur"
      type="range"
      min="0"
      max="6"
      step="0.25"
      value="6"
    />

    <span id="setlistShadowBlurValue">
      6px
    </span>
  </div>
</div>

      <!-- 表示形式 -->

      <section
        class="controlGroup"
        aria-labelledby="listStyleTitle"
      >
        <div class="controlGroupHeader">
          <h3 id="listStyleTitle">
            表示形式
          </h3>
        </div>

        <div
          class="segmentedControl"
          role="radiogroup"
          aria-label="セットリストの表示形式"
        >
          <button
            id="numberStyleButton"
            class="segmentButton isActive"
            type="button"
            role="radio"
            aria-checked="true"
            data-list-style="number"
          >
            1. 2. 3.
          </button>

          <button
            id="bulletStyleButton"
            class="segmentButton"
            type="button"
            role="radio"
            aria-checked="false"
            data-list-style="bullet"
          >
            ・
          </button>

          <button
  id="imageStyleButton"
  class="segmentButton"
  type="button"
  role="radio"
  aria-checked="false"
  data-list-style="image"
>
  画像
</button>
        </div>
        <div
  id="setlistMarkerImageControls"
  class="markerImageControls"
  hidden
>

<input
  id="setlistMarkerImageInput"
  class="fileInput"
  type="file"
  accept="image/png,image/jpeg,image/webp,image/gif"
  hidden
/>

<button
  type="button"
  id="setlistMarkerImageButton"
  class="markerImageButton"
>
  🖼 マーカー画像を選択
</button>

<p
  id="setlistMarkerImageName"
  class="fieldHint"
>
  未選択（PNG・JPEG・WebP・GIF対応）
</p>

<div class="rangeField">
  <div class="rangeFieldHeader">
    <label
      class="fieldLabel"
      for="setlistMarkerImageSize"
    >
      アイコンサイズ
    </label>

<span id="setlistMarkerImageSizeValue">
  100%
</span>
  </div>

<input
  id="setlistMarkerImageSize"
  type="range"
  min="20"
  max="300"
  step="5"
  value="100"
/>
</div>  

</div>

<label
  class="fieldLabel"
  for="setlistLineHeightInput"
>
  行間
</label>

<div class="rangeInputRow">
  <input
    id="setlistLineHeightInput"
    type="range"
    min="0.8"
    max="2.0"
    step="0.05"
    value="1.20"
  />

  <span id="setlistLineHeightValue">
    1.20
  </span>
</div>

      </section>

<!-- スクロール設定 -->

<section
  class="controlGroup"
  aria-labelledby="scrollSettingsTitle"
>
  <label
    class="fieldLabel"
    for="visibleSongsInput"
  >
    表示する曲数
  </label>

  <input
    id="visibleSongsInput"
    class="textInput"
    type="number"
    min="1"
    step="1"
    value="10"
  />

  <label
  class="fieldLabel"
  for="scrollSpeedInput"
>
  スクロール速度
</label>

  <div class="rangeInputRow">
    <input
      id="scrollSpeedInput"
      type="range"
      min="1"
      max="100"
      step="1"
      value="20"
    />

    <span id="scrollSpeedValue">
      20
    </span>
  </div>
</section>

</div>

<div
  id="editorTab"
  class="settingsTabPanel"
  hidden
>

  <section
    class="controlGroup"
    aria-labelledby="editorTitle"
  >

<div class="editorSongControl">
  <input
    id="editorSongInput"
    class="textInput"
    type="text"
    placeholder="曲名を入力"
  />

  <div class="editorSongActions">
    <button
      type="button"
      id="sendNowPlayingButton"
      class="secondaryButton"
    >
      曲名を送信
    </button>

    <button
      type="button"
      id="addCurrentSongButton"
      class="primaryButton"
    >
      セットリストに追加
    </button>
  </div>
</div>

  <textarea
  id="setlistEditor"
  class="textInput"
  rows="16"
  placeholder="1行に1曲ずつ入力します"
></textarea>

<div class="editorFooter">

  <p
    id="editorSongCount"
    class="helpText"
  >
    現在：0曲
  </p>

  <button
    id="updateEditorButton"
    class="primaryButton"
    type="button"
  >
    更新
  </button>

</div>

  </main>

  <!-- 削除確認モーダル -->

  <div
    id="confirmModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirmModalTitle"
    aria-describedby="confirmModalText"
    hidden
  >
    <button
      class="modalBackdrop"
      type="button"
      aria-label="ダイアログを閉じる"
      data-close-modal
    ></button>

    <div class="modalCard">
      <p class="modalEyebrow">
        CONFIRM
      </p>

      <h2 id="confirmModalTitle">
        セットリストを削除しますか？
      </h2>

      <p id="confirmModalText">
        登録されている曲をすべて削除します。
      </p>

      <div class="modalActions">
        <button
          id="cancelClearButton"
          class="secondaryButton"
          type="button"
          data-close-modal
        >
          キャンセル
        </button>

        <button
          id="confirmClearButton"
          class="dangerButton"
          type="button"
        >
          削除する
        </button>
      </div>
    </div>
  </div>

  <div class="pageZoomControl">
    <label for="pageZoomSelect">
      表示倍率
    </label>

    <select id="pageZoomSelect">
      <option value="0.75">75%</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="1" selected>100%</option>
      <option value="1.1">110%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
  </div>

  <script>
    const pageZoomSelect =
      document.getElementById(
        "pageZoomSelect"
      );

    const appElement =
      document.querySelector(".app");

    const savedPageZoom =
      localStorage.getItem(
        "setlistToolPageZoom"
      ) || "1";

    pageZoomSelect.value =
      savedPageZoom;

    appElement.style.zoom =
      savedPageZoom;

    pageZoomSelect.addEventListener(
      "change",
      () => {
        const selectedZoom =
          pageZoomSelect.value;

        appElement.style.zoom =
          selectedZoom;

        localStorage.setItem(
          "setlistToolPageZoom",
          selectedZoom
        );
      }
    );
  </script>
</body>
</html>
