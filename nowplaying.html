<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Now Playing</title>

  <link
    rel="stylesheet"
    href="style.css?v=7"
  />
</head>

<body class="obsBody nowPlayingBody">

<svg
  width="0"
  height="0"
  aria-hidden="true"
  style="position: absolute;"
>
  <defs>
    <filter
      id="nowPlayingGlowFilter"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
      color-interpolation-filters="sRGB"
    >
<feGaussianBlur
  id="nowPlayingGlowBlur"
  in="SourceAlpha"
  stdDeviation="8"
  result="glowBlur"
/>

<feFlood
  id="nowPlayingGlowColor"
  flood-color="#ffffff"
  flood-opacity="1"
  result="glowColor"
/>

      <feComposite
        in="glowColor"
        in2="glowBlur"
        operator="in"
        result="coloredGlow"
      />

      <feMerge>
        <feMergeNode in="coloredGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
</svg>  

<div class="obsSetlist">

  <div class="nowPlayingRow">

    <img
      id="currentSongMarkerImage"
      class="currentSongMarkerImage"
      alt=""
      hidden
    />

    <div class="nowPlayingViewport">

      <div
        id="currentSong"
        class="obsNowPlaying layeredText"
      >
        <span
          id="currentSongShadow"
          class="layeredTextShadow"
        ></span>

        <span
          id="currentSongStroke"
          class="layeredTextStroke"
        ></span>

        <span
          id="currentSongFill"
          class="layeredTextFill"
        ></span>
      </div>

    </div>

  </div>

</div>

<script src="script.js?v=7"></script>

</body>
</html>
